[workspace]
resolver = "3"
members = ["crates/broza", "crates/broza-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/borlafu/broza"
homepage = "https://github.com/borlafu/broza"
authors = ["Borja Lafuente Romero"]

[workspace.dependencies]
broza = { path = "crates/broza", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
jiff = { version = "0.2", features = ["serde"] }
globset = "0.4"
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }
assert_cmd = "2"
predicates = "3"
libc = "0.2"
trybuild = "1"
plist = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSURL",
    "NSArray",
    "NSString",
    "NSDictionary",
    "NSError",
    "NSValue",
] }
rayon = "1"
blake3 = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
