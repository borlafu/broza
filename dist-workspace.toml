[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# Apple Silicon only (PRD D3): the adapters call macOS APIs and the binary is
# not meant to run anywhere else.
targets = ["aarch64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The Homebrew tap the formula is pushed to (`brew install borlafu/broza/broza`)
tap = "borlafu/homebrew-broza"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# A CycloneDX SBOM per release (RNF-05)
cargo-cyclonedx = true
# The generated workflow is hand-patched (`steps.cargo-cyclonedx.outputs.paths`,
# which dist 0.32 writes as `.output.`), so `dist generate` must not overwrite it.
allow-dirty = ["ci"]
